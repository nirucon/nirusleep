name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
      - name: version matches the tag
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" && grep -qx "VERSION=$(cat VERSION)" nirusleep
      - name: test and build
        run: |
          tests/unit.sh
          mkdir -p dist && cp nirusleep dist/ && (cd dist && sha256sum nirusleep > SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz | tar -xz -C /tmp
          /tmp/gh_2.63.2_linux_amd64/bin/gh release create "$GITHUB_REF_NAME" dist/nirusleep dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "NIRUSLEEP ${GITHUB_REF_NAME#v}" --notes-file RELEASE-NOTES.md
